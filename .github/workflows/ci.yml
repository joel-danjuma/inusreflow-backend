name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insureflow
          POSTGRES_PASSWORD: insureflow
          POSTGRES_DB: insureflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insureflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://insureflow:insureflow@localhost:5432/insureflow
      # Non-superuser role the app/tests actually run queries as, so RLS
      # policies (docs/adr/0006-row-level-security.md) are enforced in CI
      # too, not silently bypassed by a superuser connection. The role
      # itself is created by the phase-7 migration, run as DATABASE_URL.
      APP_DATABASE_URL: postgresql+asyncpg://insureflow_app:insureflow_app_local_dev_only@localhost:5432/insureflow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest
