[project]
name = "insureflow"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "email-validator>=2.2.0",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
    "prometheus-client>=0.25.0",
    "reportlab>=5.0.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.140.4",
    "locust>=2.44.4",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
    "types-openpyxl>=3.1.5.20260518",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "squad_sandbox: hits the real Squad sandbox API, requires sandbox credentials",
    "load: load/perf tests, run manually, never in CI",
]
addopts = "-m \"not squad_sandbox and not load\""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Hand-aligned tuple tables for readability -- reformatting to 100 cols would
# destroy the column alignment that's the whole point of this layout.
"scripts/generate_api_docs.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery has no py.typed stubs, so @celery_app.task(...) is an untyped
# decorator under strict mode — not something we can fix from our side.
module = "app.workers.*"
disallow_untyped_decorators = false
